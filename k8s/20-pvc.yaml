apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coredesk-uploads
  namespace: coredesk
spec:
  accessModes:
    # ReadWriteOnce 이므로 앱 replicas 는 1로 유지한다.
    # 다중 replica 가 필요하면 RWX 스토리지(NFS 등)로 교체할 것.
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # 기본 StorageClass 를 사용한다. 지정이 필요하면 주석을 해제한다.
  # storageClassName: local-path
