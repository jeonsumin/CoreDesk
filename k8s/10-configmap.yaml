apiVersion: v1
kind: ConfigMap
metadata:
  name: coredesk-config
  namespace: coredesk
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  # 업로드 파일은 PVC가 마운트된 /app/uploads 아래에 저장한다.
  DRIVE_UPLOAD_ROOT: "/app/uploads/drive"
  # Auth.js 콜백/포트폴리오 이미지 URL 기준값.
  # https 로 두었으므로 실제 접속도 https 여야 한다. http 로 접속하면 secure 쿠키가
  # 저장되지 않아 로그인이 실패한다. (auth-config.ts 에 trustHost: true 가 설정되어 있어
  # 리버스 프록시 뒤에서도 동작한다.)
  NEXTAUTH_URL: "https://erp.jeonsoomin.kro.kr"
