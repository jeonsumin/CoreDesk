# 이 파일은 예시다. 실제 값은 레포에 커밋하지 않고 서버에서 1회 생성한다.
# 생성 명령은 k8s/README.md "서버 최초 1회 설정" 참고.
#
# 주의: 파드 안의 localhost 는 파드 자신을 가리킨다. DB 가 k8s 노드와 같은 서버에 있어도
#       localhost / 127.0.0.1 로는 접속할 수 없다. 노드의 사설 IP 나 공인 IP 를 쓴다.
#
# FIELD_ENCRYPTION_KEY 는 프로젝트 URL/계정/DB 비밀번호 복호화 키다.
# 운영 중 변경하면 기존 데이터를 읽을 수 없으므로 절대 교체하지 않는다.
# `base64:` 접두사가 있는 값과 없는 순수 base64 32바이트 모두 허용된다
# (src/lib/field-encryption.ts).
apiVersion: v1
kind: Secret
metadata:
  name: coredesk-secrets
  namespace: coredesk
type: Opaque
stringData:
  DATABASE_URL: "mysql://coredesk:replace-with-strong-database-password@203.0.113.10:3306/coredesk"
  NEXTAUTH_SECRET: "replace-with-strong-auth-secret"
  FIELD_ENCRYPTION_KEY: "replace-with-32-byte-base64-key"
