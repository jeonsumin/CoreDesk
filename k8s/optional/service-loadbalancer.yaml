# 호스트의 3000 포트로 직접 노출할 때 사용한다.
# k3s(내장 ServiceLB) 또는 MetalLB 환경에서 노드의 :3000 에 바인딩된다.
# 서버에 이미 nginx 리버스 프록시가 있고 erp.jeonsoomin.kro.kr -> localhost:3000 으로
# 넘기고 있다면 이 방식이 기존 설정을 그대로 재사용할 수 있어 가장 간단하다.
#
# k8s/service.yaml 과 이름이 같으므로 둘 중 하나만 적용한다.
apiVersion: v1
kind: Service
metadata:
  name: coredesk
  namespace: coredesk
  labels:
    app: coredesk
spec:
  type: LoadBalancer
  selector:
    app: coredesk
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
