# LoadBalancer 도 Ingress 도 없는 환경에서 노출할 때 사용한다.
# NodePort 는 기본 허용 범위가 30000-32767 이라 3000 을 직접 쓸 수 없다.
# 호스트 :3000 으로 받아야 하면 optional/service-loadbalancer.yaml 을 쓰거나,
# 서버 nginx 에서 3000 -> 30300 으로 프록시한다.
#
# k8s/service.yaml 과 이름이 같으므로 둘 중 하나만 적용한다.
apiVersion: v1
kind: Service
metadata:
  name: coredesk
  namespace: coredesk
  labels:
    app: coredesk
spec:
  type: NodePort
  selector:
    app: coredesk
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30300
      protocol: TCP
