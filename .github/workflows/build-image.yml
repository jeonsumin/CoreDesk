name: Build Image

# 이 워크플로우는 컨테이너 이미지를 만들어 GHCR 에 푸시하는 것까지만 담당한다.
# 클러스터 배포는 서버에서 별도로 수행한다 (k8s/README.md 참고).

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: |
          if [ -d tests ]; then
            npm test
          else
            echo "tests/ 디렉터리가 없어 테스트를 건너뜁니다."
          fi

  build:
    name: Build & Push (GHCR)
    needs: verify
    # PR 에서는 빌드 검증만 하고 푸시하지 않는다.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tags
        id: meta
        run: |
          REPO="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          SHA_TAG="${REPO}:sha-${GITHUB_SHA::12}"
          TAGS="${SHA_TAG}"

          # master 푸시에는 latest, 태그 푸시에는 해당 버전 태그를 함께 붙인다.
          if [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            TAGS="${TAGS},${REPO}:latest"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAGS="${TAGS},${REPO}:${GITHUB_REF_NAME}"
          fi

          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
      
      - uses: docker/setup-qemu-action@v3
      
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### 이미지 빌드 완료"
            echo
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "PR 빌드이므로 GHCR 에 푸시하지 않았습니다."
              exit 0
            fi
            echo '태그:'
            echo '```'
            echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'
            echo '```'
            echo
            echo '서버에서 배포하려면:'
            echo '```bash'
            echo "kubectl -n coredesk set image deployment/coredesk \\"
            echo "  app=${{ steps.meta.outputs.sha_tag }} \\"
            echo "  migrate=${{ steps.meta.outputs.sha_tag }}"
            echo "kubectl -n coredesk rollout status deployment/coredesk"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
